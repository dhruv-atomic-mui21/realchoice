<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield/Pill -->
    <rect x="0" y="0" width="56" height="56" rx="28" fill="#14161f" stroke="url(#crestGlow)" stroke-width="1.8"/>
    <!-- Inner Accent Ring -->
    <circle cx="28" cy="28" r="23" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
    
    <!-- Stylized Suit / Tuxedo Silhouette -->
    <!-- Collar & Lapels -->
    <path d="M 18 16 L 24 34 L 28 26 L 32 34 L 38 16 L 33 16 L 28 22 L 23 16 Z" fill="url(#crestGlow)"/>
    <!-- Tie / Bowtie -->
    <polygon points="26,17 30,17 29,24 27,24" fill="#dc2626"/>
    <circle cx="28" cy="16.5" r="1.5" fill="#ffffff"/>
    <!-- Lapel outlines -->
    <path d="M 21 24 L 17 38 L 28 44 L 39 38 L 35 24" stroke="url(#crestGlow)" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
    <!-- Center seam -->
    <line x1="28" y1="28" x2="28" y2="43" stroke="#dc2626" stroke-width="1"/>
    
    <!-- Text arc or subtle ESTD -->
    <text x="28" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1">EST. 2015</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(70, 0)">
    <!-- Main "Real Choice" Name -->
    <text x="0" y="36" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="30" font-weight="800" fill="url(#redGlow)" letter-spacing="0.5" filter="url(#neon)">Real Choice</text>
    <!-- Subtitle / Category -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="3.5">MENSWEAR • AHMEDABAD</text>
  </g>
</svg>
